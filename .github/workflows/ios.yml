name: iOS unsigned builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  ios:
    name: ${{ matrix.profile }} device
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [Personal, Developer]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Swift Foundation policy checks
        if: matrix.profile == 'Personal'
        run: |
          swiftc ios/Vidrane/Sources/ManagedMediaPath.swift tests/ManagedMediaPathSmoke.swift -o /tmp/vidrane-path-smoke
          /tmp/vidrane-path-smoke
      - name: Swift remote transfer and loopback integration
        if: matrix.profile == 'Personal'
        run: |
          swiftc ios/Vidrane/Sources/RemoteTransferPolicy.swift tests/RemoteTransferSmoke.swift -o /tmp/vidrane-transfer-smoke
          /tmp/vidrane-transfer-smoke
          swiftc ios/Vidrane/Sources/RemoteMediaSource.swift ios/Vidrane/Sources/MediaLoopbackRelay.swift tests/MediaLoopbackSmoke.swift -o /tmp/vidrane-relay-smoke
          /tmp/vidrane-relay-smoke
      - name: WebDAV transport and Rust parser integration
        if: matrix.profile == 'Personal'
        run: |
          cargo build --release -p vidrane-ffi
          swiftc -import-objc-header ios/Vidrane/Sources/VidraneBridge.h \
            ios/Vidrane/Sources/WebDAVClient.swift tests/WebDAVClientSmoke.swift \
            -L target/release -lvidrane_ffi -liconv -o /tmp/vidrane-dav-smoke
          /tmp/vidrane-dav-smoke
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare pinned libmpv/FFmpeg for main build
        run: bash ios/mpv/prepare.sh
      - name: Generate Xcode project with MPVKit
        working-directory: ios/Vidrane
        run: xcodegen generate
      - name: Build iPhone application (unsigned)
        run: |
          xcodebuild -project ios/Vidrane/Vidrane.xcodeproj \
            -scheme Vidrane${{ matrix.profile }} -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" VIDRANE_RUST_TARGET=aarch64-apple-ios \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p stage/Payload
          cp -R build/Build/Products/Release-iphoneos/Vidrane.app stage/Payload/
          (cd stage && zip -qr "../Vidrane-${{ matrix.profile }}-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Vidrane-${{ matrix.profile }}-unsigned
          path: Vidrane-${{ matrix.profile }}-unsigned.ipa
          if-no-files-found: error
