name: iOS libmpv experimental builds
on:
  workflow_dispatch:
  push:
    paths:
      - ios/mpv/**
      - ios/Vidrane/Sources/**
      - ios/Vidrane/project.yml
      - crates/**
      - .github/workflows/ios-mpv.yml

permissions:
  contents: read

jobs:
  ios-mpv:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare pinned MPVKit sources and binary
        run: bash ios/mpv/prepare.sh
      - name: Generate MPVKit-enabled Xcode project
        working-directory: ios/Vidrane
        run: xcodegen generate --spec project-mpv.generated.yml
      - name: Build both iOS signing profiles (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          for profile in Personal Developer; do
            xcodebuild -project ios/Vidrane/Vidrane.xcodeproj \
              -scheme "Vidrane${profile}" -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' \
              -derivedDataPath "$PWD/build" VIDRANE_RUST_TARGET=aarch64-apple-ios \
              CODE_SIGNING_ALLOWED=NO build
            mkdir -p stage/Payload
            cp -R "build/Build/Products/Release-iphoneos/Vidrane.app" stage/Payload/
            (cd stage && zip -qr "../Vidrane-libmpv-${profile}-unsigned.ipa" Payload)
            rm -rf stage
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Vidrane-libmpv-unsigned
          path: Vidrane-libmpv-*-unsigned.ipa
          if-no-files-found: error
